# EZRA curated free/open model gallery
# Only include models that are downloadable without payment.
# Gated Meta/Google models still need a free HF account + license accept.
#
# Fields:
#   name            short alias used by `ezra models download <name>`
#   repo_id         Hugging Face repo
#   revision        optional git revision / branch
#   format          gguf | safetensors | mlx
#   quant           preferred quant filename pattern / tag
#   size_b          approximate parameter count (billions)
#   params          human size label
#   license         SPDX-ish short name
#   gated           true if HF license gate required
#   science_tags    chemistry / materials relevance tags
#   tags            general capability tags
#   description     one-line summary
#   files           optional explicit file list (GGUF); if omitted, snapshot
#   file_pattern    optional allow_patterns for snapshot_download
#   recommended_ram_gb  rough RAM/VRAM guidance

