# Default EZRA configuration - SITE PROFILE
#
# Created by:  ezra hpc init-site <name>
# Activate:    export EZRA_SITE=<name>
#
# ── CUSTOMIZE (search EDIT ME) ──────────────────────────────────────────────
# 1. Uncomment and set hpc.slurm.partition / account (and qos / constraint if needed)
# 2. Tweak download / serve / interactive CPUs, mem, gpus, time for your site
# 3. Set local.models_dir OR pass --models-dir to init-site / export EZRA_MODELS_DIR
# 4. Edit modules.sh (module load …) and fill NOTES.md
# 5. Commit & push this folder (no secrets) so others on the same HPC benefit
# ────────────────────────────────────────────────────────────────────────────

version: 1

local:
  backend: auto
  # EDIT ME: scratch / project path for weights (or use EZRA_MODELS_DIR)
  models_dir: ~/.ezra/models
  prefer_quant: auto
  max_workers: 2
  resume: true
  hf_token_env: HF_TOKEN

router:
  mode: auto

hpc:
  enabled: true
  endpoints: []
  slurm:
    # ── EDIT ME: site-wide SLURM knobs (uncomment what your cluster needs) ──
    # partition: gpu              # e.g. gpu, gpu-shared, a100, batch
    # account: mylab              # allocation / project account
    # qos: normal
    # constraint: a100            # if your site uses feature constraints
    download:
      time: "04:00:00"
      cpus: 4
      mem: "8G"
      gpus: 0
      # partition: download       # optional per-job override
    serve:
      time: "08:00:00"
      cpus: 8
      mem: "64G"
      gpus: 1
      # gres: "gpu:a100:1"        # EDIT ME if plain --gres=gpu:N is wrong here
    interactive:
      time: "02:00:00"
      cpus: 4
      mem: "32G"
      gpus: 1
