<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="ezraIconTitle ezraIconDesc">
  <title id="ezraIconTitle">EZRA</title>
  <desc id="ezraIconDesc">Mark of a restorer: broken stones rising into a rebuilt arch with a scribe scroll, inspired by biblical Ezra.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A4A5C"/>
      <stop offset="100%" stop-color="#0F2E3A"/>
    </linearGradient>
    <linearGradient id="stone" x1="40" y1="30" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3E6C8"/>
      <stop offset="100%" stop-color="#D9C49A"/>
    </linearGradient>
    <linearGradient id="gold" x1="54" y1="28" x2="78" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0C14B"/>
      <stop offset="100%" stop-color="#C8891E"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#2F6B7A" stroke-width="2" opacity="0.55"/>

  <!-- Ground / rubble (things destroyed) -->
  <g fill="#6E5A3E" opacity="0.9">
    <path d="M18 98h22l-3 8H21z"/>
    <path d="M38 100l12-4 6 8H40z"/>
    <path d="M22 90l8 2-2 6-9-1z"/>
  </g>
  <g fill="#8A7350" opacity="0.75">
    <rect x="16" y="102" width="14" height="6" rx="1" transform="rotate(-12 23 105)"/>
    <rect x="30" y="104" width="11" height="5" rx="1" transform="rotate(8 35.5 106.5)"/>
  </g>

  <!-- Rebuilt masonry courses (rising from ruin) -->
  <g fill="url(#stone)">
    <!-- left pier -->
    <rect x="34" y="78" width="18" height="12" rx="1.5"/>
    <rect x="34" y="64" width="18" height="12" rx="1.5"/>
    <rect x="34" y="50" width="18" height="12" rx="1.5"/>
    <!-- right pier -->
    <rect x="76" y="78" width="18" height="12" rx="1.5"/>
    <rect x="76" y="64" width="18" height="12" rx="1.5"/>
    <rect x="76" y="50" width="18" height="12" rx="1.5"/>
    <!-- springing stones -->
    <rect x="40" y="40" width="16" height="10" rx="1.5"/>
    <rect x="72" y="40" width="16" height="10" rx="1.5"/>
  </g>

  <!-- Mortar gaps -->
  <g stroke="#0F2E3A" stroke-width="1.4" opacity="0.35">
    <line x1="34" y1="76" x2="52" y2="76"/>
    <line x1="34" y1="62" x2="52" y2="62"/>
    <line x1="76" y1="76" x2="94" y2="76"/>
    <line x1="76" y1="62" x2="94" y2="62"/>
  </g>

  <!-- Arch curve -->
  <path d="M40 45 C40 28, 88 28, 88 45" fill="none" stroke="url(#stone)" stroke-width="10" stroke-linecap="butt"/>
  <path d="M44 45 C44 34, 84 34, 84 45" fill="none" stroke="#0F2E3A" stroke-width="1.2" opacity="0.25"/>

  <!-- Keystone being set (the rebuild act) -->
  <path d="M56 26 L72 26 L76 40 L64 46 L52 40 Z" fill="url(#gold)"/>
  <path d="M58 30 L70 30 L72.5 38 L64 42 L55.5 38 Z" fill="#F7E3A0" opacity="0.35"/>

  <!-- Lift marks / motion of placing the stone -->
  <g stroke="#F0C14B" stroke-width="1.6" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M64 18 v6"/>
    <path d="M58 22 l6 4 6-4" opacity="0.7"/>
  </g>

  <!-- Scroll in the gateway (Ezra the scribe / restoring the word) -->
  <g transform="translate(52 58)">
    <rect x="0" y="4" width="24" height="28" rx="2" fill="#F7F0DE"/>
    <path d="M0 4 C-3 4,-3 12,0 12" fill="#E8D9B0"/>
    <path d="M24 4 C27 4,27 12,24 12" fill="#E8D9B0"/>
    <path d="M0 32 C-3 32,-3 24,0 24" fill="#DCCBA0"/>
    <path d="M24 32 C27 32,27 24,24 24" fill="#DCCBA0"/>
    <g stroke="#1A4A5C" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
      <line x1="5" y1="14" x2="19" y2="14"/>
      <line x1="5" y1="19" x2="19" y2="19"/>
      <line x1="5" y1="24" x2="15" y2="24"/>
    </g>
  </g>

  <!-- Fresh course starting above rubble (continuity of rebuild) -->
  <rect x="52" y="90" width="24" height="8" rx="1.5" fill="url(#stone)" opacity="0.95"/>
</svg>
