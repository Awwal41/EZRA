# EZRA example config — copy to ~/.ezra/ezra.yaml or set EZRA_CONFIG
version: 1

local:
  backend: auto
  # On HPC, point this at a shared scratch/project filesystem:
  #   export EZRA_MODELS_DIR=/scratch/$USER/ezra/models
  models_dir: ~/.ezra/models
  prefer_quant: Q4_K_M
  max_workers: 2
  resume: true
  hf_token_env: HF_TOKEN

router:
  mode: auto

hpc:
  enabled: false
  endpoints: []
