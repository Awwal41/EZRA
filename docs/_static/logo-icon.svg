<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="ezraIconTitle ezraIconDesc">
  <title id="ezraIconTitle">EZRA</title>
  <desc id="ezraIconDesc">Rising structure from a broken base with a keystone being placed - rebuilding in progress.</desc>
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="square">
    <!-- Incomplete base -->
    <path d="M22 98 H48"/>
    <path d="M62 98 H98"/>
    <!-- Rising columns of different heights (rebuilding in progress) -->
    <path d="M30 98 V58"/>
    <path d="M50 98 V38"/>
    <path d="M70 98 V28"/>
    <path d="M90 98 V48"/>
    <!-- Completed upper beam -->
    <path d="M30 28 H90"/>
  </g>
  <!-- The final stone / keystone being placed -->
  <rect x="55" y="18" width="18" height="12" fill="#1a1a1a"/>
</svg>
